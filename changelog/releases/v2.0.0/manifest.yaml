title: Agent-specific skill targets and safe reconciliation
intro: >-
  Skeel now manages skills for individual agents, with dedicated targets, discovery-aware
  paths, and portable custom installers. It also makes reconciliation safe by preserving
  undeclared skills by default while providing explicit pruning and execution-time
  deletion safeguards.
